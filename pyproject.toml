[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-mysql-analytics"
version = "0.1.0"
description = "Reproducible MySQL analysis of Olist commerce and fulfillment"
requires-python = ">=3.10"
dependencies = ["PyMySQL[rsa]>=1.1,<2", "python-dotenv>=1,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["ruff>=0.9", "sqlglot>=26", "duckdb>=1.2,<3"]

[project.scripts]
olist = "olist_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
